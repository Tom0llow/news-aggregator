# Project-local Codex configuration.
#
# Network policy:
# - ordinary workspace sandbox commands stay offline
# - Git/GitHub network operations must use allow-listed read commands or
#   guarded PowerShell wrappers from `.codex/rules/default.rules`
# - this avoids exposing credentials to the sandbox and keeps `.git/.codex`
#   mutations behind narrow wrappers.

approval_policy = "on-request"
approvals_reviewer = "user"

sandbox_mode = "workspace-write"
web_search = "live"

project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

[sandbox_workspace_write]
network_access = false
writable_roots = []

[windows]
sandbox = "unelevated"

[shell_environment_policy]
inherit = "all"

# Keep KEY / SECRET / TOKEN variables out of ordinary Codex subprocesses.
# GitHub authentication is expected to use the host credential store from
# allow-listed host-side commands, not GH_TOKEN inside the sandbox.
ignore_default_excludes = false

[history]
persistence = "save-all"

[features]
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4
